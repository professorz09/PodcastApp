  <!-- importmap removed: Vite bundles all deps locally —
       CDN fallback was causing extra network round-trips on every load -->
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-gray-900 text-white antialiased">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        const isDev = location.port === '3000' || location.hostname.includes('run.app') || location.hostname === 'localhost';
        if (isDev) {
          navigator.serviceWorker.getRegistrations().then((regs) => {
            for (const reg of regs) {
              reg.unregister();
            }
          });
          if ('caches' in window) {
            caches.keys().then((keys) => {
              for (const k of keys) {
                if (k.startsWith('autovid-ai')) caches.delete(k);
              }
            });
          }
        } else {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js').catch(() => {});
          });
        }
      }
    </script>
  </body>
